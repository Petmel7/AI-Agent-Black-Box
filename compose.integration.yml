services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blackbox_integration
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox_integration
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blackbox -d blackbox_integration']
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data
